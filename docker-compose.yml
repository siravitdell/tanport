name: tanport

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tanport
      POSTGRES_PASSWORD: tanport
      POSTGRES_DB: tanport
      TZ: UTC
    # 5433 on the host: 5432 is taken by a native PostgreSQL install.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tanport -d tanport"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  redisdata:
